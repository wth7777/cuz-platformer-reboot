<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Cuz's Creepy Jaunt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background: #1b1b22;
        overflow: hidden;
        /* no scrolling, zooming or pull-to-refresh while playing */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* Game viewport — Phaser's Scale.FIT keeps the 16:9 canvas inside this box */
      #game-container {
        flex: 1;
        min-height: 0;
        position: relative;
      }

      /* ---- Virtual Joystick - Classic Arcade Style ---- */
      #joystick-base {
        position: fixed;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: 
          radial-gradient(circle at 30% 30%, #2a2a2a 0%, #151515 70%, #0a0a0a 100%),
          radial-gradient(circle at 70% 70%, #1a1a1a 0%, #0a0a0a 100%);
        border: 3px solid #2a2a2a;
        box-shadow: 
          inset 0 3px 6px rgba(255,255,255,0.1),
          inset 0 -3px 6px rgba(0,0,0,0.3),
          0 4px 12px rgba(0,0,0,0.4),
          0 0 0 1px rgba(255,255,255,0.05);
        pointer-events: none;
        transition: opacity 150ms ease-out, visibility 0s 150ms;
        z-index: 100;
        opacity: 0;
        visibility: hidden;
      }

      #joystick-base.active {
        opacity: 1;
        visibility: visible;
        transition: opacity 100ms ease-out, visibility 0s;
      }

      #joystick-shaft {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 50px;
        height: 90px;
        margin-left: -25px;
        margin-top: -90px;
        background: 
          linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 50%, #1a1a1a 100%),
          linear-gradient(90deg, #444 0%, #2a2a2a 50%, #1a1a1a 100%);
        border-radius: 10px;
        border-left: 1px solid #3a3a3a;
        border-right: 1px solid #1a1a1a;
        box-shadow: 
          inset 2px 0 4px rgba(255,255,255,0.1),
          inset -2px 0 4px rgba(0,0,0,0.3),
          0 2px 4px rgba(0,0,0,0.3);
        transform-origin: center bottom;
        transform: translate(-50%, -100%) rotate(0deg);
        transition: transform 80ms cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 10;
      }

      #joystick-handle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 56px;
        height: 56px;
        margin-left: -28px;
        margin-top: -98px;
        background: 
          radial-gradient(circle at 30% 30%, #ffffff 0%, #e0e0e0 40%, #c0c0c0 70%, #a0a0a0 100%),
          radial-gradient(circle at 70% 70%, #c0c0c0 0%, #808080 100%);
        border-radius: 50%;
        border: 2px solid #909090;
        box-shadow: 
          inset 0 -3px 6px rgba(255,255,255,0.3),
          inset 0 3px 6px rgba(0,0,0,0.2),
          0 4px 8px rgba(0,0,0,0.4),
          0 0 0 1px rgba(255,255,255,0.2);
        transform-origin: center center;
        transform: translate(-50%, -50%);
        z-index: 20;
      }

      /* Tilt classes for shaft */
      #joystick-shaft.tilt-left { transform: translate(-50%, -100%) rotate(-18deg); }
      #joystick-shaft.tilt-right { transform: translate(-50%, -100%) rotate(18deg); }
      #joystick-shaft.tilt-up { transform: translate(-50%, -100%) rotate(-18deg) scaleY(1.1); }
      #joystick-shaft.tilt-down { transform: translate(-50%, -100%) rotate(18deg) scaleY(1.1); }
      #joystick-shaft.tilt-center { transform: translate(-50%, -100%) rotate(0deg); }

      #joystick-knob {
        display: none;
      }

      /* ---- Touch controls overlay (both orientations) ---- */
      #touch-controls {
        display: none;
      }

      body.touch #touch-controls {
        display: flex;
        position: fixed;
        right: 0;
        bottom: 0;
        width: auto;
        height: auto;
        background: none;
        border: 0;
        pointer-events: none;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0 calc(34px + env(safe-area-inset-right))
          calc(16px + env(safe-area-inset-bottom))
          calc(34px + env(safe-area-inset-left));
        z-index: 50;
      }

      /* swapped = action buttons on the left, joystick zone on the right (not used in new layout) */
      #touch-controls.swapped {
        justify-content: flex-start;
        padding: 0 calc(34px + env(safe-area-inset-left))
          calc(16px + env(safe-area-inset-bottom))
          calc(34px + env(safe-area-inset-right));
      }

      /* ---- swap toggle bar (between the game and the controls) ---- */
      #controls-bar {
        display: none;
      }

      body.touch #controls-bar {
        display: flex;
        justify-content: center;
        padding: 6px calc(8px + env(safe-area-inset-right)) 6px
          calc(8px + env(safe-area-inset-left));
        background: #232329;
        border-top: 1px solid #3a3a46;
      }

      #swap-controls {
        border: none;
        border-radius: 8px;
        background: #3c3c46;
        color: #cfcfd8;
        font-family: monospace;
        font-size: 13px;
        padding: 7px 16px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      #swap-controls:active {
        filter: brightness(1.3);
      }

      /* ---- action buttons ---- */
      .actions {
        display: flex;
        flex-direction: row;
        gap: 16px;
        align-items: center;
        justify-content: flex-end;
        pointer-events: auto;
      }

      .ctrl {
        border: none;
        border-radius: 12px;
        background: #3c3c46;
        color: #cfcfd8;
        font-size: 24px;
        font-family: monospace;
        box-shadow: 0 4px 0 #15151a;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .btn-a {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #a83246;
        color: #ffe3e8;
        box-shadow: 0 4px 0 #5e1c28;
        margin-bottom: 30px;
      }

      .btn-b {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #b8742a;
        color: #fff3dd;
        box-shadow: 0 4px 0 #6b3f12;
      }

      .ctrl.pressed {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #15151a;
        filter: brightness(1.3);
      }

      /* ---- narrow phones: shrink the buttons so everything fits ---- */
      @media (max-width: 430px) {
        body.touch #touch-controls {
          padding: 0 calc(24px + env(safe-area-inset-right))
            calc(12px + env(safe-area-inset-bottom))
            calc(24px + env(safe-area-inset-left));
        }

        .btn-a,
        .btn-b {
          width: 64px;
          height: 64px;
        }

        .actions {
          gap: 10px;
        }

        #joystick-base {
          width: 128px;
          height: 128px;
        }

        #joystick-knob {
          width: 80px;
          height: 80px;
        }
      }

      /* ---- very narrow landscape: rotate hint ---- */
      #rotate-hint {
        display: none;
      }

      @media (orientation: landscape) and (max-height: 280px) {
        body.touch #rotate-hint {
          position: fixed;
          inset: 0;
          z-index: 20;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #1b1b22ee;
          color: #ffffff;
          font-family: monospace;
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
      <div id="controls-bar">
        <button id="swap-controls" type="button" tabindex="-1">&#8644; Swap controls</button>
      </div>
      <div id="touch-controls">
        <div class="actions">
          <button class="ctrl btn-a" id="btn-jump" data-key="jump" tabindex="-1">A</button>
          <button class="ctrl btn-b" id="btn-fire" data-key="fire" tabindex="-1">B</button>
        </div>
      </div>
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <div id="rotate-hint">&#10227; Rotate your device</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
